[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-checker"
version = "0.1.0"
description = "Excel/剪贴板表格数据检查辅助桌面工具（基于 JSON 规则引擎）"
readme = "README.md"
requires-python = ">=3.11"  # 目标运行环境 Python 3.13；代码对 3.11+ 向前兼容
dependencies = [
    "PyQt5>=5.15.9",
    "requests>=2.31.0",
]

# 注意：本项目不依赖 `pip install -e .` 或控制台脚本。
# 请直接用独立入口启动所有服务：python main.py

[tool.setuptools]
packages = ["excel_checker"]

[tool.black]
line-length = 100
target-version = ["py311", "py313"]
